<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- SSOT: src/config/constants.ts의 APP_NAME -->
    <title>빠알리 프라이머</title>
    <meta name="description" content="빠알리 문자와 발음부터 격변화·동사까지 차근차근" />

    <!-- 링크 미리보기 (카카오톡 등) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="빠알리어 공부" />
    <meta property="og:title" content="빠알리 프라이머 — 빠알리어 공부" />
    <meta property="og:description" content="빠알리 문자와 발음부터 격변화·동사까지 차근차근" />
    <meta property="og:image" content="https://dhammapiya3-lab.github.io/palistudy/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://dhammapiya3-lab.github.io/palistudy/primer/" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 아이콘 · 홈 화면 추가 -->
    <link rel="icon" type="image/svg+xml" href="/palistudy/primer/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/palistudy/primer/icon-192.png" />
    <link rel="apple-touch-icon" href="/palistudy/primer/apple-touch-icon.png" />
    <link rel="manifest" href="/palistudy/primer/manifest.json" />
    <meta name="theme-color" content="#C06B0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="빠알리 프라이머" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- 글꼴: 빠알리 글자(Noto Serif) + 한글(Pretendard) — 화면을 막지 않도록 swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

    <!-- 저장된 화면 테마를 첫 화면부터 적용 (깜빡임 방지) -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('suttalog2-storage') || '{}')
          var t = (s.state && s.state.theme) || 'system'
          var dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) { /* 무시 */ }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
