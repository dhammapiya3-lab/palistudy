<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/palistudy/suttalog/favicon.svg" />

    <link rel="apple-touch-icon" href="/palistudy/suttalog/apple-touch-icon.png" />
    <!-- 손가락 확대(핀치 줌)를 막지 않음 — 작은 빠알리 발음 기호를 확대해 볼 수 있게 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#C06B0A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="경전으로 배우기" />
    <link rel="manifest" href="/palistudy/suttalog/manifest.json" />
    <title>경전으로 배우기</title>

    <!-- 링크 미리보기(카카오톡·문자 등) -->
    <meta name="description" content="삼귀의·오계부터 대념처경까지, 빠알리어 경전을 한 구절씩 배우는 앱" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="빠알리어 공부" />
    <meta property="og:title" content="경전으로 배우기 — 빠알리어 공부" />
    <meta property="og:description" content="삼귀의·오계부터 대념처경까지" />

    <meta property="og:image" content="https://dhammapiya3-lab.github.io/palistudy/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 글꼴: 빠알리 = Noto Serif(Google Fonts), 한글 UI = Pretendard(jsDelivr) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
