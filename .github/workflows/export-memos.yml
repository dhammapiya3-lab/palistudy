# 메모 목록 내보내기 (사진 제외): probe/memo-export 가지에 올리면 실행
name: Export memos
on:
  push:
    branches: ['probe/memo-export']
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: 메모 목록 출력
        run: |
          K=AIzaSyDDNRL69ugkKb6mJPnJb2kQud0_3b97viA
          BASE="https://firestore.googleapis.com/v1/projects/panditarama-video/databases/(default)/documents/pali-primer-memos"
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          K='AIzaSyDDNRL69ugkKb6mJPnJb2kQud0_3b97viA'
          BASE='https://firestore.googleapis.com/v1/projects/panditarama-video/databases/(default)/documents/pali-primer-memos'
          d=[]; tok=''
          while True:
              u=BASE+'?pageSize=300&key='+K+('&pageToken='+urllib.parse.quote(tok) if tok else '')
              j=json.load(urllib.request.urlopen(u))
              d+=j.get('documents',[]); tok=j.get('nextPageToken')
              if not tok: break
          def v(f,k):
              x=f.get(k,{})
              return x.get('stringValue', x.get('nullValue', None) if 'nullValue' in x else x.get('stringValue'))
          print('COUNT', len(d))
          for x in d:
              f=x['fields']
              imgs=f.get('images',{}).get('arrayValue',{}).get('values',[])
              row={'id':x['name'].split('/')[-1],'createdAt':v(f,'createdAt'),'updatedAt':v(f,'updatedAt'),'page':v(f,'page'),
                   'stepId':v(f,'stepId'),'status':v(f,'status'),'text':v(f,'text'),'images':len(imgs),'device':v(f,'deviceId'),'app':v(f,'app'),'snapshot':v(f,'snapshot')}
              print('MEMO\t'+json.dumps(row,ensure_ascii=False))
          PY
