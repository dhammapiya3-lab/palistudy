# 메모 저장 진단: probe/memo 가지에 올리면 실행 (사이트에는 영향 없음)
name: Probe memo store
on:
  push:
    branches: ['probe/memo']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 실제 사이트에서 메모 보내기 시험
        run: |
          mkdir t && cd t && npm init -y >/dev/null && npm i -s playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          # 휴대폰 사진 크기의 시험 사진 5장 (압축이 잘 안 되는 무늬)
          for i in 1 2 3 4 5; do convert -size 3000x4000 plasma:fractal -quality 95 big$i.jpg; done; ls -la big*.jpg
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright'
          const b = await chromium.launch()
          const pg = await b.newPage({ viewport: { width: 390, height: 780 } })
          pg.on('console', m => { if (m.type() === 'error' || m.type() === 'warning') console.log('[콘솔]', m.type(), m.text().slice(0, 600)) })
          pg.on('pageerror', e => console.log('[페이지오류]', e.message))
          pg.on('requestfailed', r => console.log('[요청실패]', r.url().slice(0, 120), r.failure()?.errorText))
          pg.on('response', r => { if (r.url().includes('firestore')) console.log('[firestore]', r.status(), r.url().slice(0, 140)) })
          for (const url of ['https://dhammapiya3-lab.github.io/palistudy/primer/#/', 'https://dhammapiya3-lab.github.io/palistudy/primer/#/learn/lesson-02']) {
            console.log('===== ', url)
            await pg.goto(url); await pg.waitForTimeout(3000)
            await pg.click('[aria-label="메모"]'); await pg.waitForTimeout(800)
            await pg.click('text=새 메모'); await pg.waitForTimeout(500)
            await pg.fill('textarea', '진단 테스트 메모 (자동 삭제)')
            if (url.includes('lesson')) await pg.setInputFiles('input[type=file]', ['big1.jpg','big2.jpg','big3.jpg','big4.jpg','big5.jpg'])
            const t0 = Date.now()
            await pg.click('text=메모 보내기')
            for (let i = 0; i < 40; i++) {
              await pg.waitForTimeout(500)
              const busy = await pg.locator('button:has-text("저장 중")').count()
              if (!busy) break
            }
            console.log('걸린 시간(초):', (Date.now() - t0) / 1000)
            console.log('화면 글자:', (await pg.locator('body').innerText()).replace(/\s+/g, ' ').slice(0, 300))
            console.log('버튼 상태:', await pg.locator('button:has-text("저장 중"), button:has-text("메모 보내기")').first().textContent().catch(() => '?'))
            await pg.goto('about:blank')
          }
          await b.close()
          JS
          node t.mjs
      - name: 시험 메모 지우기 + 최근 메모
        run: |
          K=AIzaSyDDNRL69ugkKb6mJPnJb2kQud0_3b97viA
          BASE="https://firestore.googleapis.com/v1/projects/panditarama-video/databases/(default)/documents/pali-primer-memos"
          curl -s "$BASE?pageSize=400&key=$K" | python3 -c '
          import sys,json,subprocess
          d=json.load(sys.stdin).get("documents",[])
          print("전체", len(d))
          for x in d:
              f=x["fields"]; t=f.get("text",{}).get("stringValue","")
              if "진단 테스트" in t:
                  imgs=f.get("images",{}).get("arrayValue",{}).get("values",[])
                  print("지움", x["name"].split("/")[-1], f.get("page",{}).get("stringValue"), "사진", len(imgs), "크기", len(json.dumps(f)))
                  subprocess.run(["curl","-s","-X","DELETE","https://firestore.googleapis.com/v1/"+x["name"]+"?key=AIzaSyDDNRL69ugkKb6mJPnJb2kQud0_3b97viA"])
          '
