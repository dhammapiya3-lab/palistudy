# 빠알리 프라이머 발음 mp3 만들기
# tts/sample 또는 tts/full-<목소리키> 가지(branch)에 올리면 실행되고,
# 만든 결과를 같은 가지에 다시 올림. (main 사이트에는 영향 없음)
name: Generate Pali TTS

on:
  push:
    branches: ['tts/**']
    # (자동 작업이 올린 결과는 다시 실행되지 않으므로 반복 걱정 없음)

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install edge-tts aksharamukha

      - name: 발음 만들기
        working-directory: primer/scripts/tts
        run: |
          BR="${GITHUB_REF_NAME}"
          if [ "$BR" = "tts/sample" ]; then
            python generate.py sample
          elif [ "$BR" = "tts/sample-ny" ]; then
            python generate.py ny
          elif [ "${BR#tts/add-}" != "$BR" ]; then
            python generate.py add "${BR#tts/add-}"
          elif [ "$BR" = "tts/letters" ]; then
            python letters.py
          elif [ "$BR" = "tts/sutta" ]; then
            python sutta.py
          elif [ "$BR" = "tts/redo-texts" ]; then
            python redo_texts.py redo_texts.json
          elif [ "$BR" = "tts/redo" ]; then
            python redo.py "ñh"
          elif [ "$BR" = "tts/compare3" ]; then
            python compare3.py
          elif [ "$BR" = "tts/compare2" ]; then
            python compare2.py
          elif [ "$BR" = "tts/letters-vowels" ]; then
            python letters.py vowels
          elif [ "$BR" = "tts/probe" ]; then
            python probe.py
          else
            python generate.py full "${BR#tts/full-}"
          fi

      - name: 결과 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A primer/public/audio
          if [ -d suttalog/public/audio ]; then git add -A suttalog/public/audio; fi
          if [ -d primer/tts-samples ]; then git add -A primer/tts-samples; fi
          git commit -m "발음 mp3 생성 (${GITHUB_REF_NAME})" || echo "변경 없음"
          git push
