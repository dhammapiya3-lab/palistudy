# 대문 + 두 앱을 함께 빌드해서 한 사이트로 배포
#   /palistudy/           → portal/ (대문)
#   /palistudy/primer/    → primer/ (빠알리 프라이머)
#   /palistudy/suttalog/  → suttalog/ (경전으로 배우기)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 앱에서 올리는 메모(memos/)만 바뀐 경우에는 다시 배포하지 않음
    paths-ignore:
      - 'memos/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            primer/package-lock.json
            suttalog/package-lock.json

      # 두 앱 모두 같은 방식: npm run build (= tsc -b && vite build, 타입 검사 후 빌드)
      # 어느 한 앱이라도 타입 오류·빌드 오류가 나면 배포를 멈춤 → 사이트는 이전 판 그대로 유지됨
      - name: 빠알리 프라이머 빌드
        working-directory: primer
        run: |
          npm ci
          npm run build

      - name: 경전으로 배우기 빌드
        working-directory: suttalog
        run: |
          npm ci
          npm run build

      - name: 한 사이트로 합치기
        run: |
          # 404.html은 반드시 site 맨 위에 있어야 함(경전 앱 깊은 주소 복원용)
          mkdir -p site
          cp -r portal/. site/
          test -f site/404.html
          cp -r primer/dist site/primer
          cp -r suttalog/dist site/suttalog

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
